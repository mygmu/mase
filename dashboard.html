<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MASE Live Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
<style>
  .dwrap{max-width:1180px;margin:0 auto;padding:18px}.dtop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}.dtop .brand2{display:flex;align-items:center;gap:10px}.dtop .logo{width:34px;height:34px;border-radius:9px;background:var(--gold);display:grid;place-items:center;font-weight:800;color:#2a1d00}.live{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;color:var(--muted)}.dotlive{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}.progwrap{height:10px;background:rgba(255,255,255,.18);border-radius:999px;overflow:hidden;margin-top:12px}.progwrap > i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:999px}
</style>
</head>
<body>
<div class="modal-bg" id="loginOverlay" style="display:none;background:var(--bg)">
  <div class="card" style="width:min(400px,100%)">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><div style="width:36px;height:36px;border-radius:9px;background:var(--gold);display:grid;place-items:center;font-weight:800;color:#2a1d00">M</div><div><b>MASE Live Dashboard</b><div class="small muted">Gulf Medical University</div></div></div>
    <div class="field"><label>Dashboard password</label><input type="password" id="pwInput" onkeydown="if(event.key==='Enter')doLogin()" autocomplete="current-password"></div>
    <button class="btn" style="width:100%" id="loginBtn" onclick="doLogin()">Open dashboard</button>
  </div>
</div>
<div class="dwrap" id="dashRoot" style="display:none">
  <div class="dtop"><div class="brand2"><div class="logo">M</div><div><b>GMU MASE</b> <span class="chip cat">Live Platform</span><div class="small muted">Gulf Medical University MASE Exhibition</div></div></div><div class="live"><span class="dotlive"></span><span id="state">Updating…</span> · <button class="btn sub sm" onclick="loadAll()">Refresh now</button></div></div>
  <div id="hero"></div>
  <div id="stats" style="margin-top:14px"></div>
  <div class="tab-pills" id="tabs" style="margin-top:16px"></div>
  <div id="tabbody"></div>
  <p class="small muted" style="text-align:center;margin-top:24px">Standings are provisional unless marked final. Contact details are never shown here.</p>
</div>
<div class="toast" id="toast"></div>
<script>
var TOKEN=sessionStorage.getItem('mase_dash_token')||null;
function apiCall(action,args){if(!window.API_URL||window.API_URL.indexOf('PASTE_')===0)return Promise.reject(new Error('API URL is not set in config.js')); return fetch(window.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:action,args:args})}).then(function(r){return r.json();}).then(function(d){if(d&&d.error){throw new Error(d.error);}return d;});}
function call(fn){var a=[].slice.call(arguments,1);return apiCall(fn,[TOKEN].concat(a));}
function callPublic(fn){var a=[].slice.call(arguments,1);return apiCall(fn,a);}
function esc(s){return String(s==null?'':s).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function toast(m,k){var t=document.getElementById('toast');t.textContent=m;t.className='toast show '+(k||'');setTimeout(function(){t.className='toast';},2600);}
window.onload=function(){ if(TOKEN){ start(); } else { showLogin(); } };
function showLogin(){document.getElementById('dashRoot').style.display='none';document.getElementById('loginOverlay').style.display='grid';var i=document.getElementById('pwInput');if(i){i.value='';}setTimeout(function(){var x=document.getElementById('pwInput'); if(x)x.focus();},50);}
function doLogin(){var pw=document.getElementById('pwInput').value;if(!pw)return;var b=document.getElementById('loginBtn');b.disabled=true;b.textContent='Opening…'; callPublic('login',pw).then(function(r){TOKEN=r.token;sessionStorage.setItem('mase_dash_token',TOKEN);document.getElementById('loginOverlay').style.display='none';b.disabled=false;b.textContent='Open dashboard';start();}).catch(function(e){toast(e.message||e,'err');b.disabled=false;b.textContent='Open dashboard';});}
function start(){document.getElementById('dashRoot').style.display='';loadAll();setInterval(loadAll,20000);}
function loadAll(){ document.getElementById('state').textContent='Updating…'; Promise.all([call('getDashboardData'),call('getRankings')]).then(function(r){ var DATA=r[0],RANKS=r[1]; var s=DATA.settings||{},c=DATA.cards; var exName=s.ExhibitionName||'MASE Exhibition'; document.getElementById('hero').innerHTML='<div class="cc"><span class="tag">'+esc(exName)+'</span><div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px"><div><h1>Live Evaluation &amp; Results Dashboard</h1><div class="ccsub">Instant score tracking and standings.</div></div><div class="small" style="color:#B9D6CA">Updated '+new Date().toLocaleTimeString()+'</div></div><div style="display:flex;justify-content:space-between;margin-top:14px;color:#CFE7DC;font-size:.8rem"><span>Judging progress ('+c.completed+' of '+c.expected+' evaluations)</span><span style="font-weight:700">'+c.percentComplete+'%</span></div><div class="progwrap"><i style="width:'+c.percentComplete+'%"></i></div></div>'; document.getElementById('stats').innerHTML='<div class="stats"><div class="statcard"><div class="ic">📦</div><div class="n">'+c.participants+'</div><div class="l">Total projects</div><div class="s">'+(c.fullyEvaluated||0)+' fully scored</div></div><div class="statcard"><div class="ic">🧾</div><div class="n">'+c.completed+'</div><div class="l">Evaluations done</div><div class="s">Recorded in real time</div></div><div class="statcard"><div class="ic">⭐</div><div class="n">'+(c.avgScore||0)+'</div><div class="l">Avg score (/40)</div><div class="s">Across all criteria</div></div><div class="statcard"><div class="ic">🏁</div><div class="n">'+((String(s.ResultsFinal)==='true')?'Final':'Provisional')+'</div><div class="l">Competition status</div><div class="s">'+((String(s.ResultsFinal)==='true')?'Final Results':'Provisional Standings')+'</div></div></div>'; var tabs=[['top','🏆 Overall Top 10'],['cat','By category'],['sch','🏫 School standings'],['reg','📍 Regional performance'],['tick','Live ticker ('+(DATA.recent||[]).length+')']]; document.getElementById('tabs').innerHTML=tabs.map(function(t){return '<button class="'+(t[0]==='top'?'active':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>';}).join(''); paintTab(RANKS,DATA); document.getElementById('state').textContent='Updated '+new Date().toLocaleTimeString(); }).catch(function(e){var m=(e&&e.message)||''; if(/\[AUTH\]/.test(m)){TOKEN=null;sessionStorage.removeItem('mase_dash_token');showLogin();return;} document.getElementById('state').textContent='Error';toast(m||'Could not load dashboard','err');}); }
function paintTab(RANKS,DATA){ var b=document.getElementById('tabbody'); if(!RANKS){b.innerHTML='<div class="panel"><div class="empty">No ranking data yet.</div></div>';return;} b.innerHTML='<div class="panel"><div class="empty">Ranking data is available.</div></div>'; }
function setTab(t){ document.getElementById('tabs').querySelectorAll('button').forEach(function(el){el.classList.toggle('active',el.textContent.includes(t==='top'?'Overall Top 10':t==='cat'?'By category':t==='sch'?'School standings':t==='reg'?'Regional performance':'Live ticker')); }); }
</script>
</body>
</html>
